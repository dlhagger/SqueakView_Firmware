name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m compileall -q src tools tests
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run mousehouse-clock-sync --help

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - fixed_ratio
          - free_feeding
          - go_nogo_automated
          - setup_debug
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install platformio
      - run: pio run -e ${{ matrix.environment }}
